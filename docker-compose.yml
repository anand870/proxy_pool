version: '3.8'

services:
  proxy_pool:
    build: .
    container_name: proxy_pool
    restart: always
    ports:
      - "9443:9443"
    depends_on:
      - proxy_redis
    environment:
      DB_CONN: "redis://@proxy_redis:6379/0"
      AUTH_TOKEN: "${AUTH_TOKEN:-}"
      SSL_ENABLED: "${SSL_ENABLED:-true}"
      GATEWAY_DOMAIN: "${GATEWAY_DOMAIN:-}"
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "2"
    # Generate the cert once on the host first: scripts/gen_gateway_cert.sh
    volumes:
      - ./gateway:/app/gateway:ro
    deploy:
      resources:
        limits:
          memory: 300M

  proxy_redis:
    image: "redis:alpine"
    container_name: proxy_redis
    restart: always
    command: redis-server --save "" --appendonly no
    deploy:
      resources:
        limits:
          memory: 150M